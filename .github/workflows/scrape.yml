name: Scrape Shows

on:
  schedule:
    - cron: '0 6 * * *'   # 2am ET daily
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install scraper dependencies
        run: cd scraper && npm ci

      - name: Run scrapers
        run: cd scraper && node index.js

      - name: Commit shows.json if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/shows.json
          git diff --staged --quiet || git commit -m 'chore: update shows data [skip ci]'
          git push
